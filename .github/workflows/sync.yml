name: TimeTree Multi-Calendar Sync

on:
  schedule:
    # 毎日3時間おきに自動実行する設定（UTC表記で毎時0分）
    - cron: "17 */3 * * *"
  workflow_dispatch: # ボタンを押して手動で即時実行も可能にする

jobs:
  sync-all:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. 作者のリポジトリから同期プログラムをダウンロードしてくる
      - name: Clone timetree-sync-action project
        run: |
          git clone https://github.com external-action

      # 2. Python環境のセットアップと、必要なパッケージのインストール
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          cd external-action/timetree-sync-action
          pip install -r requirements.txt

      # 3. 【グループ1】Timetree Mirror  への同期 (②、③、④)
      - name: Sync - ② 優奈ちゃん予定 (to Mirror)
        env:
          TIMETREE_EMAIL: ${{ secrets.TIMETREE_EMAIL }}
          TIMETREE_PASSWORD: ${{ secrets.TIMETREE_PASSWORD }}
          TIMETREE_CALENDAR_NAME: '優奈ちゃん予定'
          GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID_MIRROR }}
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
        run: |
          cd external-action/timetree-sync-action
          python main.py

      - name: Sync - ③ 25-26 League one (to Mirror)
        env:
          TIMETREE_EMAIL: ${{ secrets.TIMETREE_EMAIL }}
          TIMETREE_PASSWORD: ${{ secrets.TIMETREE_PASSWORD }}
          TIMETREE_CALENDAR_NAME: '25-26 League one'
          GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID_MIRROR }}
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
        run: |
          cd external-action/timetree-sync-action
          python main.py

      - name: Sync - ④ ほかお家族カレンダー (to Mirror)
        env:
          TIMETREE_EMAIL: ${{ secrets.TIMETREE_EMAIL }}
          TIMETREE_PASSWORD: ${{ secrets.TIMETREE_PASSWORD }}
          TIMETREE_CALENDAR_NAME: 'ほかお家族カレンダー'
          GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID_MIRROR }}
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
        run: |
          cd external-action/timetree-sync-action
          python main.py

      # 4. 【グループ2】Timetree Mirror ゆいちろくにこちくわ への同期 (①)
      - name: Sync - ① ゆいちろくにこちくわ (to Timetree Mirror ゆいちろくにこちくわ)
        env:
          TIMETREE_EMAIL: ${{ secrets.TIMETREE_EMAIL }}
          TIMETREE_PASSWORD: ${{ secrets.TIMETREE_PASSWORD }}
          TIMETREE_CALENDAR_NAME: 'ゆいちろくにこちくわ'
          GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID_YUKUNCHI }}
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
        run: |
          cd external-action/timetree-sync-action
          python main.py
